<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="gd" x1="0" x2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#0B3A52"/>
      <stop offset="1" stop-color="#05293A"/>
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur"/>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#gd)"/>
  <g opacity="0.14" fill="#fff" filter="url(#f)">
    <circle cx="160" cy="80" r="120"/>
    <circle cx="420" cy="220" r="90"/>
    <circle cx="920" cy="90" r="160"/>
  </g>
  <g transform="translate(60,40)">
    <text x="0" y="70" font-family="Inter, Arial, sans-serif" font-size="56" fill="#E6EEF3" font-weight="700">Prakash Leena</text>
    <text x="0" y="110" font-family="Inter, Arial, sans-serif" font-size="20" fill="#E6EEF3" opacity="0.9">AI & Machine Learning enthusiast · creative demos & model tooling</text>
    <!-- subtle ML motif: connected nodes -->
    <g transform="translate(700,30)" fill="#E6EEF3" opacity="0.18">
      <circle cx="40" cy="40" r="18"/>
      <circle cx="90" cy="20" r="10"/>
      <circle cx="120" cy="60" r="14"/>
      <line x1="40" y1="40" x2="90" y2="20" stroke="#E6EEF3" stroke-width="6" stroke-linecap="round" stroke-opacity="0.18"/>
      <line x1="90" y1="20" x2="120" y2="60" stroke="#E6EEF3" stroke-width="6" stroke-linecap="round" stroke-opacity="0.18"/>
    </g>
  </g>
</svg>
